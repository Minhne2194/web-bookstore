services:
  - type: web
    name: bookstore-api
    runtime: node
    rootDir: backend-bookstore
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/src/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: bookstore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_RETURN_URL
        sync: false
      - key: PAYOS_CANCEL_URL
        sync: false
      - key: PORT
        value: "3000"
databases:
  - name: bookstore-db
    plan: free

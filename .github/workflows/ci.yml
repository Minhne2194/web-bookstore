name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  backend-test:
    name: Backend (Unit + E2E + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-bookstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-bookstore/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
  frontend-build:
    name: Frontend (TypeScript + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-bookstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-bookstore/package-lock.json
      - run: npm ci
      - run: npm run build
